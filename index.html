<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PRO Electrical Inspection</title>
<meta name="theme-color" content="#1F3864">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#1F3864; --blue:#2E75B6; --grey:#595959; --light:#F2F2F2;
  --line:#D4D8DE; --red:#C00000; --amber:#B8860B; --green:#2E7D32;
  --orange:#C55A11; --neutral:#7F8792;
  --bg:#EEF1F5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg); color:#111; font-size:16px; line-height:1.4;
  padding-bottom:120px;
}
.wrap{max-width:940px;margin:0 auto;padding:0 12px}

/* header */
header{background:#fff;border-bottom:3px solid var(--navy);padding:14px 0;margin-bottom:14px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hdr .name{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:.3px}
.hdr .meta{font-size:12px;color:var(--grey);margin-top:3px;line-height:1.5}
.hdr img{height:58px;width:auto;display:block}

/* section cards */
section{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.sh{
  background:var(--navy);color:#fff;padding:11px 14px;font-weight:700;font-size:14px;
  letter-spacing:.6px;text-transform:uppercase;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;user-select:none
}
.sh .chev{font-size:13px;opacity:.85;transition:transform .15s}
section.collapsed .sh .chev{transform:rotate(-90deg)}
section.collapsed .body{display:none}
.body{padding:14px}

/* fields */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.f label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
.f .hint{font-weight:400;color:var(--grey);font-style:italic;font-size:11px}
.f input,.f textarea,.f select{
  width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:7px;
  font-size:16px;font-family:inherit;background:#fff
}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,117,182,.15)}
.f textarea{min-height:76px;resize:vertical}

/* tri-state questions */
.q{border-bottom:1px solid var(--line);padding:11px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.q:last-child{border-bottom:none}
.q .qt{flex:1;font-size:14px}
.seg{display:flex;gap:5px;flex:none}
.seg button{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 12px;
  font-size:13px;font-weight:700;color:var(--grey);cursor:pointer;min-width:46px
}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg button.on[data-v="H"]{background:var(--red);border-color:var(--red)}
.seg button.on[data-v="D"]{background:var(--orange);border-color:var(--orange)}
.seg button.on[data-v="M"]{background:var(--amber);border-color:var(--amber)}
.seg button.on[data-v="S"]{background:var(--green);border-color:var(--green)}
.seg button.on[data-v="N"]{background:var(--neutral);border-color:var(--neutral)}
.seg button.on[data-v="Yes"]{background:var(--red);border-color:var(--red)}
.seg button.on[data-v="No"]{background:var(--green);border-color:var(--green)}

/* checklist */
.grp{margin-bottom:18px}
.grp h3{font-size:14px;color:var(--navy);margin:0 0 8px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}
.item.flag{border-color:var(--amber);background:#FFFDF5}
.item.haz{border-color:var(--red);background:#FFF6F6}
.itop{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.inum{font-weight:800;color:var(--navy);font-size:13px;min-width:34px}
.itxt{flex:1;min-width:180px;font-size:14px}
.item .note{margin-top:8px;display:none}
.item.show-note .note{display:block}
.inlinedef{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.idh{font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
.idh span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--grey);font-style:italic;margin-left:6px}
.item .note > input{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font-size:15px}

.keyrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:12px}
.keyrow span{background:var(--light);border-radius:6px;padding:6px 9px;color:var(--grey)}
.keyrow b{color:var(--navy)}

/* deficiency cards */
.def{border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:8px;padding:12px;margin-bottom:12px;background:#fff}
.def.haz{border-left-color:var(--red)}
.def .dh{font-weight:800;color:var(--navy);margin-bottom:3px}
.def .ds{font-size:13px;color:var(--grey);margin-bottom:10px}
.empty{color:var(--grey);font-style:italic;padding:10px 0;font-size:14px}

/* cloud panel */
.cloudbox{border:1px solid #d7dde6;border-radius:10px;padding:12px;margin-bottom:16px;background:#f7f9fc}
.cbh{font-weight:700;color:#1F3864;margin-bottom:8px}
.cbon{color:#2E7D32;font-weight:700}
.cboff{color:#7F8792;font-weight:700}
.cloudbox input{width:100%;padding:9px;border:1px solid #c9d2dd;border-radius:7px;font-size:14px}
.cloudbox label{display:block;font-size:13px;font-weight:600;color:#1F3864;margin:4px 0}
.cba{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cba button{padding:8px 12px;border:1px solid #2E75B6;background:#fff;color:#2E75B6;
  border-radius:7px;font-size:13px;font-weight:600}
.cba button.danger{border-color:#C00000;color:#C00000}
.cbs{margin-top:9px;font-size:12.5px;color:#595959}
/* photos */
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ph{position:relative;width:88px;height:88px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{
  position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;
  border-radius:50%;width:22px;height:22px;font-size:14px;line-height:1;cursor:pointer
}
.addph{
  width:88px;height:88px;border:2px dashed var(--blue);border-radius:7px;background:#F5F9FD;
  color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;display:flex;
  align-items:center;justify-content:center;text-align:center;padding:4px
}
.addph.upload{border-style:solid;border-color:var(--line);background:#FAFBFC;color:var(--grey)}
@media(max-width:460px){
  .bar .inner{gap:6px}
  .btn{font-size:13px;padding:13px 4px;white-space:nowrap}
}
.vstamp{margin-top:16px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11px;color:var(--grey);text-align:right;letter-spacing:.3px}
.rec{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:9px}
.rh{display:flex;align-items:center;gap:8px;justify-content:space-between}
.rw{font-weight:800;color:var(--navy);font-size:14px}
.rtag{flex:none;font-size:10px;font-weight:800;color:#fff;background:var(--blue);
  border-radius:5px;padding:3px 7px;text-transform:uppercase;letter-spacing:.3px}
.rm{font-size:12px;color:var(--grey);margin-top:3px}
.ra{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.ra button{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:6px;
  padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.ra button.del{border-color:var(--line);color:var(--grey);margin-left:auto}
.pbadge{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--grey);
  border-radius:4px;padding:2px 6px;margin-left:7px;vertical-align:middle;letter-spacing:.3px}
.fixw{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.fixw.on{border-top-color:var(--green)}
.fixt{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:700;color:var(--navy)}
.fixt .bx{width:20px;height:20px;border:2px solid var(--line);border-radius:5px;flex:none;position:relative}
.fixt .bx.on{border-color:var(--green);background:var(--green)}
.fixt .bx.on:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.fixh{display:block;font-size:11px;font-weight:400;color:var(--grey);margin-top:2px}
.fixb{margin-top:11px;border-left:3px solid var(--green);padding-left:11px}
.fixwarn{margin-top:10px;font-size:12px;color:var(--grey);background:#FFF8E8;
  border:1px solid #E8D9A8;border-radius:7px;padding:9px 11px;line-height:1.45}
.supb{border:1px solid var(--blue);border-radius:9px;padding:12px;margin-bottom:14px;background:#F5F9FD}
.supb.hid{display:none}
.supn{font-size:12px;color:var(--grey);margin-bottom:10px;line-height:1.45}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;font-weight:700;color:var(--navy)}
.prog .track{flex:1;height:7px;background:var(--light);border-radius:4px;overflow:hidden}
.prog .fill{height:100%;background:var(--blue);border-radius:4px;transition:width .2s}
.prog.done .fill{background:var(--green)}
.prog .cnt{flex:none;min-width:96px;text-align:right;color:var(--grey);font-weight:600}
.prog.done .cnt{color:var(--green)}

.ovl{position:fixed;inset:0;background:rgba(15,22,38,.55);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:90}
.mdl{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:82vh;
  display:flex;flex-direction:column;overflow:hidden}
.mdl h2{background:var(--navy);color:#fff;margin:0;padding:14px 18px;font-size:15px}
.mdl .mb{padding:16px 18px;overflow:auto}
.mdl .lead{font-size:13px;color:var(--grey);margin:0 0 12px}
.mdl h3{font-size:12px;color:var(--navy);margin:14px 0 7px;text-transform:uppercase;letter-spacing:.4px}
.mdl h3:first-child{margin-top:0}
.gap{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:13px}
.gap.req{border-color:var(--red);background:#FFF6F6}
.gap .gt{flex:1}
.gap .gn{font-weight:800;color:var(--navy);margin-right:7px}
.gap button{flex:none;border:1px solid var(--blue);background:#fff;color:var(--blue);
  border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.more{font-size:12px;color:var(--grey);padding:4px 2px}
.mdl .mf{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;justify-content:flex-end}
.mdl .mf button{border-radius:8px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer}
.mdl .mf .go{border:1px solid var(--line);background:#fff;color:var(--navy)}
.mdl .mf .cont{border:1px solid var(--navy);background:var(--navy);color:#fff}
@keyframes fl{0%,100%{background:transparent}30%{background:#FFF4D6}}
.flash{animation:fl 1.4s ease}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dentry{padding-top:2px}
.dentry + .dentry{margin-top:14px;padding-top:14px;border-top:1px dashed var(--blue)}
.eh{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.elab{font-size:13px;font-weight:800;color:var(--navy);letter-spacing:.3px}
.delent{border:1px solid var(--line);background:#fff;color:var(--grey);border-radius:6px;
  padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer}
.delent:active{background:var(--light)}
.addent{margin-top:12px;width:100%;border:1px dashed var(--blue);background:#F5F9FD;color:var(--blue);
  border-radius:7px;padding:11px;font-size:13px;font-weight:700;cursor:pointer}
.addent:active{background:#E8F1FA}

/* signature */
.sigbox{border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:6px}
canvas.sig{width:100%;height:170px;display:block;touch-action:none;border-radius:8px}
.sigbar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--grey)}
.sigbar button{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}

/* radios */
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14px}
.opt.on{border-color:var(--blue);background:#F5F9FD}
.opt .bx{width:20px;height:20px;border:2px solid var(--line);border-radius:4px;flex:none;margin-top:1px}
.opt.on .bx{background:var(--blue);border-color:var(--blue);position:relative}
.opt.on .bx:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* terms */
.terms{font-size:12.5px;color:#333;max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:12px;background:#FAFBFC}
.terms li{margin-bottom:9px}
.warn{color:var(--red);font-weight:700;font-size:13px;margin-bottom:10px}

/* action bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 12px;display:flex;gap:9px;box-shadow:0 -3px 14px rgba(0,0,0,.09);z-index:50
}
.bar .inner{max-width:940px;margin:0 auto;display:flex;gap:9px;width:100%}
.btn{
  flex:1;padding:14px 10px;border-radius:9px;border:none;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit
}
.btn.primary{background:var(--navy);color:#fff}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn:disabled{opacity:.5}
.status{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#111;color:#fff;
  padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
.status.on{opacity:.94}
.note-sm{font-size:12px;color:var(--grey);margin-top:8px}
</style>
</head>

const MAXR = 60;

let DIRTY = false;
function save(){
  DIRTY = true;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

function newId(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadReports(){
  try{
    const r = localStorage.getItem(RKEY);
    const list = r ? JSON.parse(r) : [];
    list.forEach(rec=>{ if(rec && rec.state) migrateAnswers(rec.state); });
    return list;
  }
  catch(e){ return []; }
}

/* photos are stripped from the archive: base64 images would fill the browser
   storage quota within a handful of reports. The saved PDF holds the images. */
function stripPhotos(state){
  const c = JSON.parse(JSON.stringify(state));
  let n = 0;
  Object.keys(c.defects||{}).forEach(id=>{
    (c.defects[id]||[]).forEach(d=>{
      if(d && d.photos && d.photos.length){
        /* a Drive id is a few dozen bytes, so a synced photo can stay in the
           archive and come back on a revision. Base64 still cannot. */
        const kept = d.photos.filter(ph=>ph && ph.fid).map(ph=>({fid:ph.fid, w:ph.w, h:ph.h}));
        n += d.photos.length - kept.length;
        d.photos = kept;
      }
    });
  });
  c.photosDropped = n;
  return c;
}

function writeReports(list){
  for(let attempt=0; attempt<8; attempt++){
    try{ localStorage.setItem(RKEY, JSON.stringify(list)); return true; }
    catch(e){
      if(list.length <= 1) return false;
      list.splice(list.length-1, 1);   /* drop the oldest and try again */
    }
  }
  return false;
}

/* called once a report is actually issued, so the archive holds issued work only */
function archiveCurrent(){
  if(!S.id) S.id = newId();
  const list = loadReports().filter(r=>r.id !== S.id);
  list.unshift({
    id: S.id,
    savedAt: new Date().toISOString(),
    reportNo: S.info.reportNo || '',
    address:  S.info.address  || '',
    city:     S.info.city     || '',
    client:   S.info.client   || '',
    dateInsp: S.info.dateInsp || '',
    type:     S.info.reportType || REPORT_TYPES[0],
    state:    stripPhotos(S)
  });
  while(list.length > MAXR) list.pop();
  const ok = writeReports(list);
  save();
  return ok;
}
/* The recalled-panel question was removed from the insurer list. Answers are
   keyed by position, so anything saved under the old list has to be shifted
   down past the gap or every later answer reads against the wrong question. */
const QSET = 2, QGONE = 2;
function migrateAnswers(st){
  if(!st || st.qset >= QSET) return st;
  const a = st.answers || {}, out = {};
  Object.keys(a).forEach(k=>{
    const i = parseInt(k,10);
    if(isNaN(i) || i === QGONE) return;
    out[i > QGONE ? i-1 : i] = a[k];
  });
  st.answers = out; st.qset = QSET;
  return st;
}
function load(){
  try{
    const r = localStorage.getItem(KEY);
    if(r) Object.assign(S, migrateAnswers(JSON.parse(r)));
  }catch(e){}
}

}

function fieldHTML(store,[k,label,hint,type,opts]){
  const raw = S[store][k]||"";
  const v = esc(raw);
  const lab = `<label>${esc(label)}${hint?` <span class="hint">${esc(hint)}</span>`:""}</label>`;
  if(type==="select"){
    const known = !raw || opts.includes(raw);
    if(!known){
      return `<div class="f">${lab}
        <input type="text" data-store="${store}" data-k="${k}" value="${v}">
        <div class="note-sm"><a href="#" data-backsel="${store}|${k}">Choose from list instead</a></div>
      </div>`;
    }
    return `<div class="f">${lab}
      <select data-store="${store}" data-k="${k}" data-sel="1">
        <option value="">Select</option>
        ${opts.map(o=>`<option value="${esc(o)}" ${raw===o?"selected":""}>${esc(o)}</option>`).join("")}
        <option value="__other">Other (type it in)</option>
      </select>

  }
  return `<div class="f">${lab}

  </div>`;
}

     <p style="font-size:13px;margin:14px 0 6px"><b>Client acknowledgement.</b> I have received and read this report, including the scope, limitations and disclaimer above, and I accept its terms.</p>
     <div class="grid">
       ${fieldHTML('cert',["clientName","Client name (print)"])}
       ${fieldHTML('cert',["clientDate","Date","","date"])}
     </div>
     <div class="f" style="margin-top:12px"><label>Client signature</label>
       <div class="sigbox"><canvas class="sig" id="sigClient"></canvas>
       <div class="sigbar"><span>Client signs above</span>
       <button type="button" data-clearsig="sigClient">Clear</button></div></div></div>`);

  app.innerHTML = h;
  renderDefects();
  renderProgress();
  initSig("sigInsp","sigInsp");
  initSig("sigClient","sigClient");
}

function renderDefects(){
  const box = document.getElementById('defs');
  if(!box) return;
  const flagged = Object.keys(S.ratings).filter(k=>isOpen(k));
  flagged.sort((a,b)=>{
    const [al,an]=a.split("."), [bl,bn]=b.split(".");
    return al===bl ? (+an)-(+bn) : al.localeCompare(bl);
  });
  if(!flagged.length){
    box.innerHTML = `<div class="empty">No items rated M, D or H yet. Anything you flag in the checklist appears here automatically with a photo slot.</div>`;
    return;
  }
  box.innerHTML = flagged.map(id=>{
    const txt = lookupItem(id);
    const haz = S.ratings[id]==="H";
    return `<div class="def ${haz?'haz':''}">
      <div class="dh">${id} &nbsp;<span style="font-weight:400;color:var(--grey)">rated ${S.ratings[id]}</span></div>
      <div class="ds">${esc(txt)}</div>
      ${defBlockHTML(id)}
    </div>`;
  }).join("");
}

function lookupItem(id){
  const [L,n] = id.split(".");
  const sec = SECTIONS.find(s=>s[0]===L);
  return sec ? sec[2][(+n)-1] : id;
}

/* ---------------- signature pads ---------------- */
function initSig(canvasId, stateKey){
  const c = document.getElementById(canvasId);
  if(!c) return;
  const ratio = window.devicePixelRatio||1;
  const r = c.getBoundingClientRect();
  c.width = r.width*ratio; c.height = r.height*ratio;
  const ctx = c.getContext('2d');
  ctx.scale(ratio,ratio);
  ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  if(S[stateKey]){
    const img = new Image();
    img.onload = ()=>ctx.drawImage(img,0,0,r.width,r.height);
    img.src = S[stateKey];
  }
  let drawing=false;
  const pos = e => {
    const b = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [t.clientX-b.left, t.clientY-b.top];
  };
  const start = e => { e.preventDefault(); drawing=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
  const move  = e => { if(!drawing) return; e.preventDefault(); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  const end   = () => { if(!drawing) return; drawing=false; S[stateKey]=c.toDataURL('image/png'); save(); };
  c.addEventListener('pointerdown',start); c.addEventListener('pointermove',move);
  c.addEventListener('pointerup',end); c.addEventListener('pointerleave',end);
  c.addEventListener('touchstart',start,{passive:false});
  c.addEventListener('touchmove',move,{passive:false});
  c.addEventListener('touchend',end);
}

/* ---------------- photo capture ---------------- */
/* A camera photo taken through a web page is handed straight to the page and is
   not kept by the camera app, so we also write the untouched original to the
   device's Downloads. Uploaded photos already exist on the device and are skipped. */
let copyN = 0;
function keepCopy(f, defId){
  if(localStorage.getItem('proKeepPhotos') === '0') return;
  try{
    const a1 = (S.info.address||'inspection').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
    const d1 = S.info.dateInsp || new Date().toISOString().slice(0,10);
    const ext = (f.name && f.name.indexOf('.')>-1) ? f.name.split('.').pop().toLowerCase() : 'jpg';
    const url = URL.createObjectURL(f);
    const a = document.createElement('a');
    a.href = url;
    a.download = `PRO-${a1}-${d1}-${defId}-${++copyN}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
  }catch(e){}
}
function pickPhoto(defId, ei, mode){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  if(mode==='camera') inp.capture='environment';
  inp.onchange = () => {
    const files = Array.from(inp.files||[]);
    let pending = files.length;
    if(!pending) return;
    toast("Processing photo...");
    files.forEach(f=>{
      if(mode==='camera') keepCopy(f, defId);
      const rd = new FileReader();
      rd.onerror = () => { if(--pending===0){ save(); syncPhotos(defId,ei); } toast("Could not read that file",3000); };
      rd.onload = () => {
        const img = new Image();
        img.onerror = () => { if(--pending===0){ save(); syncPhotos(defId,ei); } toast("That image format is not supported",3600); };
        img.onload = () => {
          const max = 1280;
          let w = img.width, hh = img.height;
          if(w>max||hh>max){ const s=Math.min(max/w,max/hh); w=Math.round(w*s); hh=Math.round(hh*s); }
          const cv = document.createElement('canvas');
          cv.width=w; cv.height=hh;
          cv.getContext('2d').drawImage(img,0,0,w,hh);
          const ent = defEntries(defId)[ei] || (defEntries(defId)[ei]={});
          ent.photos = ent.photos||[];
          ent.photos.push({src:cv.toDataURL('image/jpeg',0.72), w:w, h:hh});
          if(--pending===0){ save(); syncPhotos(defId,ei); toast("Photo added"); }
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(f);
    });
  };
  inp.click();
}

    const id=dp.dataset.delph, ei=+dp.dataset.ei, i=+dp.dataset.i;
    defEntries(id)[ei].photos.splice(i,1); save(); syncPhotos(id,ei); return;
  }

  const ae = t.closest('[data-addent]');
  if(ae){
    const id = ae.dataset.addent;
    defEntries(id).push({});

  const de = t.closest('[data-delent]');

/* ---------------- cloud sync ---------------- */
/* Apps Script backend. Everything here is optional: with no URL set the app
   behaves exactly as it did offline, which is also what happens in a basement
   with no signal. Failures queue rather than block the inspection. */

const CFGU = "proBackendUrl", QKEY = "proSyncQueue_v1";
let CLOUD = { busy:false, last:"" };

const CFGN = "proBackendUser";
function cloudUser(){
  try{ return localStorage.getItem(CFGN) || (S.cert && S.cert.inspector) || ""; }catch(e){ return ""; }
}
function setCloudUser(u){ try{ localStorage.setItem(CFGN, String(u||"").trim()); }catch(e){} }
function backendUrl(){ try{ return localStorage.getItem(CFGU) || ""; }catch(e){ return ""; } }
function setBackendUrl(u){ try{ localStorage.setItem(CFGU, String(u||"").trim()); }catch(e){} }
function cloudOn(){ return !!backendUrl(); }

/* text/plain keeps the browser from firing a CORS preflight, which Apps Script
   does not answer. The body is still JSON. */
async function api(action, payload, urlOverride){
  const url = urlOverride || backendUrl();
  if(!url) throw new Error("No backend URL set");
  const res = await fetch(url, {
    method:"POST", redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({action:action, user:cloudUser()}, payload||{}))
  });
  if(!res.ok) throw new Error("Server returned " + res.status);
  const j = await res.json();
  if(!j.ok && !j.conflict) throw new Error(j.error || "Request failed");
  return j;
}

function cloudMeta(){
  return {
    address:S.info.address||"", city:S.info.city||"", client:S.info.client||"",
    reportType:S.info.reportType||REPORT_TYPES[0], reportNo:S.info.reportNo||"",
    dateInsp:S.info.dateInsp||"", rev:S.info.revNo||"",
    status:(S.condition==null?"In progress":"Issued")
  };
}

/* Photos go to Drive once and are referenced by id thereafter. The local copy
   keeps its src so the app and the PDF still work with no signal. */
async function uploadPhotos(){
  let n = 0;
  const ids = Object.keys(S.defects||{});
  for(const id of ids){
    const arr = S.defects[id]||[];
    for(let ei=0; ei<arr.length; ei++){
      const d = arr[ei]; if(!d || !d.photos) continue;
      for(let i=0; i<d.photos.length; i++){
        const ph = d.photos[i];
        if(!ph || ph.fid || !ph.src) continue;
        const r = await api("photo", {
          id:S.id, address:S.info.address||"", data:ph.src,
          name:`${slug(S.info.address||"report")}-${id}-${ei+1}-${i+1}.jpg`
        });
        ph.fid = r.fileId; n++;
      }
    }
  }
  if(n) save();
  return n;
}

/* what goes up: the same state minus the base64, which lives in Drive now */
function cloudState(){
  const c = JSON.parse(JSON.stringify(S));
  Object.keys(c.defects||{}).forEach(id=>{
    (c.defects[id]||[]).forEach(d=>{
      if(d && d.photos) d.photos.forEach(ph=>{ if(ph && ph.fid) delete ph.src; });
    });
  });
  return c;
}

/* ---- three-way merge ----
   Two devices can work the same report at once: the owner filling in client
   details and signing on the tablet while the inspector rates items and takes
   photos on the phone. Each device keeps a snapshot of the state as it last
   synced (the base). On sync, any leaf the device changed since base is kept;
   any leaf it did not touch is taken from the server. Where both devices
   changed the same leaf, the device syncing wins and the count is reported. */
const BKEY = "proSyncBase_v1";
function loadBase(){ try{ return JSON.parse(localStorage.getItem(BKEY)||"null"); }catch(e){ return null; } }
function saveBase(){ try{ localStorage.setItem(BKEY, JSON.stringify(cloudState())); }catch(e){} }

/* compare without base64: photo identity is its Drive id */
function normLeaf(v){
  if(v === undefined) return "u";
  const c = JSON.parse(JSON.stringify(v));
  if(Array.isArray(c)) c.forEach(d=>{ if(d && d.photos) d.photos.forEach(ph=>{ if(ph){ delete ph.src; } }); });
  return JSON.stringify(c);
}
/* when taking the server's version of an entry, keep any local base64 we
   already hold for the same Drive id so nothing has to be re-downloaded */
function adoptEntries(local, server){
  const have = {};
  (local||[]).forEach(d=>(d&&d.photos?d.photos:[]).forEach(ph=>{ if(ph&&ph.fid&&ph.src) have[ph.fid]=ph.src; }));
  const out = JSON.parse(JSON.stringify(server));
  (out||[]).forEach(d=>(d&&d.photos?d.photos:[]).forEach(ph=>{ if(ph&&ph.fid&&have[ph.fid]) ph.src=have[ph.fid]; }));
  return out;
}

function mergeState(server){
  const base = loadBase() || {};
  let taken = 0, kept = 0;
  const maps = ["info","cert","answers","ratings","notes","defects"];
  maps.forEach(sec=>{
    const L = S[sec] || {}, B = base[sec] || {}, V = server[sec] || {};
    const keys = new Set([].concat(Object.keys(L), Object.keys(B), Object.keys(V)));
    keys.forEach(k=>{
      const lv = normLeaf(L[k]), bv = normLeaf(B[k]), vv = normLeaf(V[k]);
      if(lv === bv){
        if(vv !== lv){
          if(V[k] === undefined) delete L[k];
          else L[k] = (sec==="defects") ? adoptEntries(L[k], V[k]) : JSON.parse(JSON.stringify(V[k]));
          taken++;
        }
      } else if(vv !== bv && vv !== lv){ kept++; }
    });
    S[sec] = L;
  });
  ["condition","sigInsp","sigClient","prev"].forEach(k=>{
    const lv = normLeaf(S[k]), bv = normLeaf(base[k]), vv = normLeaf(server[k]);
    if(lv === bv){ if(vv !== lv){ S[k] = server[k]===undefined ? null : server[k]; taken++; } }
    else if(vv !== bv && vv !== lv){ kept++; }
  });
  return {taken, kept};
}

async function hydratePhotos(){
  const want = [];
  Object.keys(S.defects||{}).forEach(k=>(S.defects[k]||[]).forEach(d=>{
    (d && d.photos ? d.photos : []).forEach(ph=>{ if(ph && ph.fid && !ph.src) want.push(ph); });
  }));
  for(let i=0;i<want.length;i++){
    try{ const p = await api("getPhoto", {fileId:want[i].fid}); want[i].src = p.data; }catch(e){}
  }
  return want.length;
}

/* the sync: push; if the server moved on, pull, merge, push again */
async function pushCurrent(opts){
  opts = opts || {};
  if(!cloudOn()) return {skipped:true};
  if(!S.id) S.id = newId();
  if(CLOUD.busy) return {busy:true};
  CLOUD.busy = true;
  try{
    await uploadPhotos();
    let r = await api("save", {
      id:S.id, state:cloudState(), meta:cloudMeta(),
      baseModified:S.cloudModified||"", force:!!opts.force
    });
    let note = "";
    if(r.conflict){
      const srv = await api("load", {id:S.id});
      const m = mergeState(migrateAnswers(srv.state||{}));
      const n = await hydratePhotos();
      S.cloudModified = srv.modified;
      r = await api("save", { id:S.id, state:cloudState(), meta:cloudMeta(), baseModified:srv.modified });
      if(r.conflict) return r;            /* two syncs collided in the same second; next pass gets it */
      if(m.taken || n) { render(); }
      const bits = [];
      if(m.taken) bits.push(`${m.taken} from other device`);
      if(m.kept)  bits.push(`${m.kept} kept from this one`);
      note = bits.length ? ` (${bits.join(", ")})` : "";
    }
    S.cloudModified = r.modified; S.cloudOwner = r.owner;
    DIRTY = false; saveBase(); save(); DIRTY = false;
    unqueue(S.id);
    CLOUD.last = "Synced " + new Date().toLocaleTimeString() + note;
    return r;
  }catch(e){
    queue(S.id);
    CLOUD.last = "Not synced: " + e.message;
    throw e;
  }finally{ CLOUD.busy = false; }
}

/* Every 20 s while online: push if this device changed anything, and pull
   if the other device did. The list call is the cheap way to see the
   server's modified stamp without downloading the report. */
async function autoSync(){
  if(!cloudOn() || !navigator.onLine || CLOUD.busy || !S.id) return;
  try{
    if(DIRTY){ await pushCurrent(); syncBadge(); return; }
    const l = await api("list");
    const me = (l.reports||[]).find(x=>x.id===S.id);
    if(me && me.modified && me.modified !== S.cloudModified){
      /* server moved, we did not: a plain pull-merge */
      CLOUD.busy = true;
      const srv = await api("load", {id:S.id});
      const m = mergeState(migrateAnswers(srv.state||{}));
      await hydratePhotos();
      S.cloudModified = srv.modified; saveBase(); save(); DIRTY = false;
      CLOUD.busy = false;
      if(m.taken){ render(); toast(`Updated from other device (${m.taken})`, 2200); }
      CLOUD.last = "Synced " + new Date().toLocaleTimeString();
      syncBadge();
    }
  }catch(e){ CLOUD.busy = false; }
}
setInterval(autoSync, 20000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) autoSync(); });

function syncBadge(){
  const el = document.getElementById('cbs');
  if(el && CLOUD.last) el.textContent = CLOUD.last;
}

async function uploadPdf(doc, name){
  if(!cloudOn()) return;
  try{
    await api("pdf", {id:S.id, address:S.info.address||"", name:name,
                      data:doc.output("datauristring")});
  }catch(e){ queue(S.id); }
}

async function pullReport(id){
  const r = await api("load", {id:id});
  const st = migrateAnswers(r.state || {});
  Object.keys(S).forEach(k=>{ delete S[k]; });
  Object.assign(S, st);
  S.id = id; S.cloudModified = r.modified; S.cloudOwner = r.owner;
  /* photos come back as ids. Fetch them now rather than lazily, so the PDF and
     the appendix behave the same as they do on the device that took them. */
  const want = [];
  Object.keys(S.defects||{}).forEach(k=>(S.defects[k]||[]).forEach(d=>{
    (d && d.photos ? d.photos : []).forEach(ph=>{ if(ph && ph.fid && !ph.src) want.push(ph); });
  }));
  for(let i=0;i<want.length;i++){
    toast(`Loading photo ${i+1} of ${want.length}...`, 1500);
    try{ const p = await api("getPhoto", {fileId:want[i].fid}); want[i].src = p.data; }
    catch(e){}
  }
  saveBase(); save(); DIRTY = false;
  return r;
}

/* offline queue, same idea as the punch queue on the timesheet app */
function queue(id){
  try{
    const q = JSON.parse(localStorage.getItem(QKEY)||"[]");
    if(q.indexOf(id)<0){ q.push(id); localStorage.setItem(QKEY, JSON.stringify(q)); }
  }catch(e){}
}
function unqueue(id){
  try{
    const q = JSON.parse(localStorage.getItem(QKEY)||"[]").filter(x=>x!==id);
    localStorage.setItem(QKEY, JSON.stringify(q));
  }catch(e){}
}
function queued(){
  try{ return JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){ return []; }
}

/* a queued report is retried only if it is the one still open, because the
   archive no longer holds its photographs in full */
async function retryQueue(){
  if(!cloudOn() || CLOUD.busy) return;
  if(queued().indexOf(S.id) < 0) return;
  try{ await pushCurrent(); toast("Synced"); }catch(e){}
}
window.addEventListener("online", ()=>{ retryQueue(); });

/* JSONP probe. A <script> tag is not subject to CORS, so this reaches the
   script even from a local file. If Google wants a sign-in instead, the
   callback never fires and we know exactly what to tell the user. */
function jsonpPing(url, ms){
  return new Promise(resolve=>{
    const cb = "__proPing" + Date.now();
    const el = document.createElement("script");
    let done = false;
    const finish = v => { if(done) return; done = true; clearTimeout(t);
      try{ delete window[cb]; }catch(e){} el.remove(); resolve(v); };
    window[cb] = j => finish(j);
    el.onerror = () => finish(null);
    const t = setTimeout(()=>finish(null), ms||9000);
    el.src = url + (url.indexOf("?")<0?"?":"&") + "action=ping&callback=" + cb;
    document.head.appendChild(el);
  });
}

async function diagnose(url){
  url = String(url||"").trim();
  if(!url) return {ok:false, msg:"Paste the web app URL first."};
  if(/\/library\//.test(url))
    return {ok:false, msg:"That is the Library URL, not the web app. In Apps Script: Deploy, Manage deployments, and copy the URL that ends in /exec."};
  if(/\/dev\/?$/.test(url))
    return {ok:false, msg:"That is the /dev test link. Copy the one ending in /exec instead."};
  if(!/^https:\/\/script\.google\.com\//.test(url) || !/\/exec\/?$/.test(url))
    return {ok:false, msg:"The URL should start with https://script.google.com/ and end in /exec."};
  if(!navigator.onLine) return {ok:false, msg:"No internet connection on this device."};

  const probe = await jsonpPing(url);
  if(!probe)
    return {ok:false, msg:"Reached Google, but it is asking for a sign-in. The deployment is not set to Anyone. In Apps Script: Deploy, Manage deployments, pencil, Who has access = Anyone, Version = New version, Deploy. Then copy the URL again."};
  if(probe.setup === false)
    return {ok:false, msg:"Connected, but setup() has not been run. In the Apps Script editor pick setup in the function list and press Run."};

  try{
    /* test the URL under test, not whatever is currently saved */
    const r = await api("ping", {}, url);
    const who = r.user || cloudUser();
    return {ok:true, msg:"Connected. Reports will be saved as " + (who || "no name set, fill in Your name above") + "."};
  }catch(e){
    return {ok:false, msg:"The script answered the probe but the browser blocked the full reply (" + e.message + "). Try opening the app from Chrome rather than another browser, or tell Paul the exact wording here."};
  }
}

function slug(s){
  return String(s||"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "report";
}

/* ---------------- report library ---------------- */

const CARRY_INFO = ["client","address","city","postal","phone","email","insurer","policy",
  "propType","yearBuilt","occupancy","svcSize","svcVolt","svcType","svcFeed","mainRating",
  "panelMake","panelModel","panelAge","subPanels","subMake","breakers","wireType","wireAge"];

function startFrom(rec, mode){
  const old = rec.state || {};
  const keep = {};
  CARRY_INFO.forEach(k=>{ if(old.info && old.info[k]) keep[k] = old.info[k]; });

  /* wipe the live form, then lay the carried-over details back in */
  Object.keys(S).forEach(k=>{ delete S[k]; });
  S.info = keep;
  S.answers = {}; S.ratings = {}; S.notes = {}; S.defects = {};
  S.condition = null;
  S.cert = {company:"PRO Electrical Services", inspector:(old.cert&&old.cert.inspector)||""};
  S.sigInsp = null; S.sigClient = null;
  S.id = newId();
  try{ localStorage.removeItem(BKEY); }catch(e){}   /* new report, no sync history */

  S.info.prevReportNo = rec.reportNo || '';
  S.info.prevDate     = rec.dateInsp || '';
  S.info.reportNo     = rec.reportNo || '';

  if(mode === 'revision'){
    /* same report, corrected. Everything carries: findings stand until marked corrected. */
    S.info.reportType = REPORT_TYPES[1];
    S.info.dateInsp = old.info ? (old.info.dateInsp||'') : '';
    S.answers   = JSON.parse(JSON.stringify(old.answers   || {}));
    S.ratings   = JSON.parse(JSON.stringify(old.ratings   || {}));
    S.notes     = JSON.parse(JSON.stringify(old.notes     || {}));
    S.defects   = JSON.parse(JSON.stringify(old.defects   || {}));
    S.condition = (old.condition===undefined?null:old.condition);
    S.cert      = JSON.parse(JSON.stringify(old.cert || S.cert));
    S.sigInsp   = old.sigInsp || null;
    const n = parseInt(old.info && old.info.revNo, 10);
    S.info.revNo = String(isNaN(n) ? 1 : n+1);
  } else {
    /* new visit, new findings. Old ratings become a reference only. */
    S.info.reportType = REPORT_TYPES[2];
    S.info.dateInsp = '';
    S.prev = {
      ratings: JSON.parse(JSON.stringify(old.ratings || {})),
      notes:   JSON.parse(JSON.stringify(old.notes   || {})),
      date:    rec.dateInsp || '',
      reportNo: rec.reportNo || ''
    };
  }
  save(); render();
  window.scrollTo(0,0);
  toast(mode==='revision' ? "Revision started from the earlier report"
                          : "Re-inspection started. Ratings cleared, previous findings shown for reference.", 4200);
}

function cstat(msg){
  CLOUD.last = msg;
  const el = document.getElementById('cbs');
  if(el) el.textContent = msg;

async function cloudAction(what){
  const inp = document.getElementById('cfgUrl');
  const nm  = document.getElementById('cfgUser');
  const redraw = ()=>{ const body = document.getElementById('repBody');
    if(body) body.innerHTML = cloudPanelHTML()+'<div id="cloudList"></div>'+reportsHTML(); };
  if(what==='off'){
    if(!confirm("Turn off cloud sync on this device? Reports already in the cloud stay there.")) return;
    setBackendUrl(''); CLOUD.last=''; redraw(); return;
  }
  if(what==='test'){
    if(nm) setCloudUser(nm.value);
    const url = inp ? inp.value.trim() : '';
    cstat('Checking...');
    const d = await diagnose(url);
    if(d.ok){ setBackendUrl(url); CLOUD.last = d.msg; redraw(); }
    else { setBackendUrl(''); cstat(d.msg); }
    return;
  }
  try{
    if(what==='push'){
      cstat('Syncing...');
      const r = await pushCurrent();
      if(r && r.conflict){ cstat('Both devices saved at the same moment. Tap Sync now again.'); return; }
      if(r && r.busy){ cstat('Already syncing...'); return; }
      cstat(CLOUD.last);
      return;
    }
    if(what==='force'){
      cstat('Overwriting...');
      await pushCurrent({force:true});
      cstat('Overwritten ' + new Date().toLocaleTimeString());
      return;
    }
    if(what==='list'){
      cstat('Loading...');
      const r = await api('list');
      const el = document.getElementById('cloudList');
      if(el) el.innerHTML = cloudListHTML(r.reports||[]);
      cstat((r.reports||[]).length + ' in the cloud');
      return;
    }
  }catch(e){ cstat('Failed: ' + e.message); }
}

/* ---------------- completeness audit ---------------- */
function allItemIds(){
  const out=[];
  SECTIONS.forEach(([L,,items])=>items.forEach((_,i)=>out.push(`${L}.${i+1}`)));
  return out;
}

/* fields the report is meaningless without */
const REQUIRED = [
  {k:'address',   label:'Property address',  sel:'[data-store="info"][data-k="address"]',   sec:'s1',
   get:()=>S.info.address},
  {k:'dateInsp',  label:'Date of inspection',sel:'[data-store="info"][data-k="dateInsp"]',  sec:'s1',
   get:()=>S.info.dateInsp},
  {k:'inspector', label:'Inspector name',    sel:'[data-store="cert"][data-k="inspector"]', sec:'s7',
   get:()=>S.cert.inspector},
  {k:'condition', label:'Overall condition', sel:'#s6 .opt',                                sec:'s6',
   get:()=>S.condition===null||S.condition===undefined?'':'set'}
];

function audit(){
  const ids = allItemIds();
  const unrated  = ids.filter(id=>!S.ratings[id]);
  const unanswered = QUESTIONS.map((q,i)=>i).filter(i=>!S.answers[i]);
  const missingReq = REQUIRED.filter(r=>!String(r.get()||'').trim()).slice();

  /* a flagged item with no observation produces an empty card in the report */
  const thin = [];
  Object.keys(S.ratings).filter(k=>isOpen(k)).forEach(id=>{
    (S.defects[id]||[]).forEach((d,ei)=>{
      const gaps=[];
      if(!String(d.observation||'').trim()) gaps.push('observation');
      if(!String(d.location||'').trim())    gaps.push('location');
      if(d.fixed && !String(d.fixWhat||'').trim()) gaps.push('work performed');
      if(d.fixed && !String(d.fixBy||'').trim())   gaps.push('who did the work');
      if(gaps.length) thin.push({id:id, ei:ei, label:entryLabel(id,ei), gaps:gaps});
    });
  });

  /* a revision that does not say what it replaces is just a second loose document */
  if(!isInitial() && !String(S.info.prevReportNo||'').trim()){
    missingReq.push({label:'Report being replaced', sel:'[data-store="info"][data-k="prevReportNo"]', sec:'s1'});
  }

  /* corrections dated nowhere read as though the whole property was re-walked today */
  const anyFixed = Object.keys(S.defects||{}).some(id=>(S.defects[id]||[]).some(d=>d&&d.fixed));
  if(!isInitial() && anyFixed && !String(S.info.dateVerify||'').trim()){
    missingReq.push({label:'Date corrective work verified', sel:'[data-store="info"][data-k="dateVerify"]', sec:'s1'});
  }

  return {
    unrated:unrated, unanswered:unanswered, missingReq:missingReq, thin:thin,
    ratedN: ids.length-unrated.length, itemsN: ids.length,
    ansN: QUESTIONS.length-unanswered.length, qN: QUESTIONS.length,
    clean: !unrated.length && !unanswered.length && !missingReq.length && !thin.length
  };
}

function renderProgress(){
  const a = audit();
  const set=(el,done,total,word)=>{
    if(!el) return;
    const pct = total? Math.round(done/total*100):0;
    el.className = 'prog' + (done===total?' done':'');
    el.innerHTML = `<div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="cnt">${done} of ${total} ${word}</div>`;
  };
  set(document.getElementById('progC'), a.ratedN, a.itemsN, 'rated');
  set(document.getElementById('progQ'), a.ansN,  a.qN,      'answered');
}

function jumpTo(sel, secId){
  closeModal();
  const sec = secId && document.getElementById(secId);
  if(sec) sec.classList.remove('collapsed');
  const el = document.querySelector(sel);
  if(!el) return;
  el.scrollIntoView({block:'center', behavior:'smooth'});
  const card = el.closest('.item') || el.closest('.q') || el.closest('.f') || el;
  card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  if(el.focus && el.tagName!=='DIV') setTimeout(()=>el.focus({preventScroll:true}), 350);
}

function closeModal(){

function gapRow(num, text, sel, sec, req){
  return `<div class="gap ${req?'req':''}">
    <div class="gt">${num?`<span class="gn">${esc(num)}</span>`:''}${esc(text)}</div>
    <button data-jump="${esc(sel)}" data-jsec="${sec||''}">Go</button></div>`;
}

/* returns true if the caller should proceed */
function preflight(actionLabel, onProceed){
  const a = audit();
  if(a.clean){ onProceed(); return; }

  const CAP = 8;
  let body = '';

  if(a.missingReq.length){
    body += `<h3>Must be filled in</h3>`;
    body += a.missingReq.map(r=>gapRow('', r.label, r.sel, r.sec, true)).join('');
  }
  if(a.unanswered.length){
    body += `<h3>Insurer questions not answered (${a.unanswered.length})</h3>`;
    body += a.unanswered.slice(0,CAP).map(i=>
      gapRow('Q'+(i+1), QUESTIONS[i], `.q[data-q="${i}"]`, 's3')).join('');
    if(a.unanswered.length>CAP) body += `<div class="more">and ${a.unanswered.length-CAP} more</div>`;
  }
  if(a.unrated.length){
    body += `<h3>Checklist items not rated (${a.unrated.length})</h3>`;
    body += a.unrated.slice(0,CAP).map(id=>
      gapRow(id, lookupItem(id), `.item[data-item="${id}"]`, 's4')).join('');
    if(a.unrated.length>CAP) body += `<div class="more">and ${a.unrated.length-CAP} more</div>`;
  }
  if(a.thin.length){
    body += `<h3>Flagged items missing detail (${a.thin.length})</h3>`;
    body += a.thin.slice(0,CAP).map(t=>
      gapRow(t.label, 'No '+t.gaps.join(' or '), `.item[data-item="${t.id}"]`, 's4')).join('');
    if(a.thin.length>CAP) body += `<div class="more">and ${a.thin.length-CAP} more</div>`;
  }

  const blocked = a.missingReq.length>0;
  const lead = blocked
    ? 'The report cannot be produced until the fields below are filled in.'
    : 'Unrated items print as a dash, which reads as a gap rather than a decision. Check these before sending.';

  const foot = blocked
    ? `<button class="go" data-close="1">Back to form</button>`
    : `<button class="go" data-close="1">Back to form</button>
       <button class="cont" data-proceed="1">${esc(actionLabel)} anyway</button>`;

  const ovl = document.createElement('div');
  ovl.className='ovl'; ovl.id='ovl';
  ovl.innerHTML = `<div class="mdl">
      <h2>${blocked?'Required fields missing':'Before you send'}</h2>
      <div class="mb"><p class="lead">${lead}</p>${body}</div>
      <div class="mf">${foot}</div>
    </div>`;
  document.body.appendChild(ovl);
  ovl._proceed = onProceed;
}

document.getElementById('btnReports').onclick = openReports;

document.addEventListener('click', e=>{
  const sr = e.target.closest('[data-startrep]');
  if(sr){
    const rec = loadReports().find(r=>r.id===sr.dataset.startrep);
    if(!rec) return;
    const mode = sr.dataset.mode;
    const word = mode==='revision'
      ? "Start a revision of this report? The current form will be replaced."
      : "Start a re-inspection? Property and client details carry over, ratings start blank. The current form will be replaced.";
    if(!confirm(word)) return;
    closeModal(); startFrom(rec, mode);
    return;
  }
  const dr = e.target.closest('[data-delrep]');
  if(dr){
    if(!confirm("Delete this report from the archive? The saved PDF is not affected.")) return;
    writeReports(loadReports().filter(r=>r.id!==dr.dataset.delrep));
    const b=document.getElementById('repBody');
    if(b) b.innerHTML = cloudPanelHTML()+'<div id="cloudList"></div>'+reportsHTML();
    return;
  }
  const cb = e.target.closest('[data-cloud]');
  if(cb){ cloudAction(cb.dataset.cloud); return; }
  const oc = e.target.closest('[data-openc]');
  if(oc){
    if(!confirm("Open this report from the cloud? The current form will be replaced.")) return;
    const id = oc.dataset.openc;
    cstat('Loading...');
    pullReport(id).then(()=>{
      closeModal(); render(); toast("Loaded from cloud");
    }).catch(err=>cstat('Failed: '+err.message));
    return;
  }

  const j = e.target.closest('[data-jump]');
  if(j){ jumpTo(j.dataset.jump, j.dataset.jsec); return; }
  const c = e.target.closest('[data-close]');
  if(c){ closeModal(); return; }
  const pr = e.target.closest('[data-proceed]');
  if(pr){
    const o=document.getElementById('ovl'), fn=o&&o._proceed;
    closeModal(); if(fn) fn();
    return;
  }
  if(e.target.id==='ovl') closeModal();
});

/* ---------------- PDF ---------------- */
const NAVY=[31,56,100], BLUE=[46,117,182], GREY=[89,89,89], LIGHT=[242,242,242], RED=[192,0,0];
const ORANGE=[197,90,17], AMBER=[184,134,11];
const M=36, PW=612, PH=792, CW=PW-M*2;

function mkDoc(){
  const {jsPDF} = window.jspdf;
  return new jsPDF({unit:'pt', format:'letter'});
}

function pdfHeader(doc){
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...NAVY);
  doc.text('PRO ELECTRICAL SERVICES', M, M+14);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GREY);
  doc.text('Box 495, Nampa, AB T0H 2R0', M, M+27);
  doc.text('780-625-5880  |  admin@proes.ca', M, M+37);
  doc.text('www.proes.ca', M, M+47);
  try{ doc.addImage(LOGO,'JPEG', PW-M-80, M-1, 80, 53); }catch(e){}
  doc.setDrawColor(...NAVY); doc.setLineWidth(1.3);
  doc.line(M, M+58, PW-M, M+58);
  return M+76;
}

function footer(doc){
  const n = doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...GREY);
    doc.text(`PRO Electrical Services  |  Box 495, Nampa, AB T0H 2R0  |  780-625-5880  |  www.proes.ca  |  Page ${i} of ${n}`,
      PW/2, PH-26, {align:'center'});
  }
}

function bar(doc,y,txt){
  doc.setFillColor(...NAVY); doc.rect(M,y,CW,17,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
  doc.text(txt.toUpperCase(), M+7, y+12);
  return y+26;
}

function need(doc,y,h){
  if(y+h > PH-46){ doc.addPage(); return M+14; }
  return y;
}

function kvGrid(doc,y,pairs){
  const cw=CW/4, rh=19;
  pairs.forEach((row,i)=>{
    y = need(doc,y,rh);
    for(let c=0;c<2;c++){
      const it = row[c]; if(!it) continue;
      const x = M + c*cw*2;
      doc.setFillColor(...LIGHT); doc.rect(x,y,cw,rh,'F');
      doc.setDrawColor(200); doc.setLineWidth(.5);
      doc.rect(x,y,cw,rh); doc.rect(x+cw,y,cw,rh);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...NAVY);
      doc.text(doc.splitTextToSize(it[0],cw-8)[0], x+4, y+12);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(0,0,0);
      doc.text(doc.splitTextToSize(String(it[1]||""),cw-8)[0], x+cw+4, y+12);
    }
    y += rh;
  });
  return y+10;
}

function buildPDF(){
  const doc = mkDoc();
  let y = pdfHeader(doc);

  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...NAVY);
  doc.text('ELECTRICAL INSPECTION REPORT', M, y); y+=13;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...GREY);
  doc.text('Visual inspection for insurance purposes', M, y); y+=18;

  // section 1
  /* report status banner: says up front that this replaces an earlier report */
  if(!isInitial()){
    const rt = S.info.reportType || '';
    const bits = [];
    if(S.info.revNo) bits.push('Revision ' + S.info.revNo);
    if(S.info.prevReportNo) bits.push('replaces report ' + S.info.prevReportNo);
    if(S.info.prevDate) bits.push('dated ' + niceDate(S.info.prevDate));
    const line2 = bits.join(', ');
    const h2 = line2 ? 32 : 21;
    y = need(doc,y,h2+10);
    doc.setFillColor(232,240,250); doc.rect(M,y,CW,h2,'F');
    doc.setDrawColor(...BLUE); doc.setLineWidth(2); doc.line(M,y,M,y+h2);
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...NAVY);
    doc.text(rt, M+8, y+13);
    if(line2){
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GREY);
      doc.text(line2.charAt(0).toUpperCase()+line2.slice(1), M+8, y+25);
    }
    y += h2+12;
  }

  y = bar(doc,y,'1. Property and client information');
  y = kvGrid(doc,y,pair(INFO1.map(f=>[f[1],S.info[f[0]]])));

  y = need(doc,y,60);
  y = bar(doc,y,'2. Electrical service summary');
  y = kvGrid(doc,y,pair(INFO2.map(f=>[f[1],S.info[f[0]]])));

  // section 3
  y = need(doc,y,80);
  y = bar(doc,y,'3. Insurer questions');
  doc.setDrawColor(200);
  QUESTIONS.forEach((q,i)=>{
    y = need(doc,y,17);
    const a = S.answers[i]||"-";
    doc.setFillColor(i%2?250:255,i%2?250:255,i%2?250:255);
    doc.rect(M,y,CW,17,'F'); doc.rect(M,y,CW,17);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(0,0,0);
    doc.text(doc.splitTextToSize(q,CW-70)[0], M+5, y+11.5);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...(a==="Yes"?RED:a==="No"?[46,125,50]:GREY));
    doc.text(a, PW-M-8, y+11.5, {align:'right'});
    y+=17;
  });
  y+=12;

  // section 4 checklist
  doc.addPage(); y = M+14;

  /* Dual-date scope note. A limited return visit must not read as a fresh walk of
     the whole property, so the document states when each part was observed. */
  if(!isInitial() && S.info.dateVerify){
    const dA = S.info.dateInsp ? niceDate(S.info.dateInsp) : 'the date of the original inspection';
    const dB = niceDate(S.info.dateVerify);
    const txt =
      'Scope of this report. The condition of the installation was assessed on ' + dA +
      '. Corrective work was verified on a return visit on ' + dB +
      '. The checklist below records the condition observed on ' + dA +
      ', amended only where an item has since been corrected, as detailed in section 5. ' +
      'No other portion of the installation was re-examined on ' + dB + '.';
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GREY);
    const ln = doc.splitTextToSize(txt, CW-20);
    const bh = ln.length*10 + 14;
    y = need(doc, y, bh+24);
    doc.setFillColor(232,240,250); doc.rect(M,y,CW,bh,'F');
    doc.setDrawColor(...BLUE); doc.setLineWidth(2); doc.line(M,y,M,y+bh);
    ln.forEach((t,k)=>doc.text(t, M+10, y+16+k*10));
    y += bh+12;
  }

  y = bar(doc,y,'4. Inspection checklist');
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...GREY);
  doc.text('S Satisfactory  |  M Monitor / minor  |  D Deficiency / repair  |  H Hazard / immediate  |  N N/A / not accessible', M, y);
  y+=14;

  SECTIONS.forEach(([L,title,items])=>{
    y = need(doc,y,42);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...NAVY);
    doc.text(`${L}. ${title}`, M, y); y+=6;
    doc.setFillColor(...BLUE); doc.rect(M,y,CW,15,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
    doc.text('#', M+5, y+10.5);
    doc.text('Item inspected', M+32, y+10.5);
    doc.text('Rating', M+330, y+10.5);
    doc.text('Notes / location', M+375, y+10.5);
    y+=15;
    items.forEach((it,i)=>{
      const id=`${L}.${i+1}`;
      const lines = doc.splitTextToSize(it, 290);
      const note = S.notes[id]||"";
      const nl = doc.splitTextToSize(note, 155);
      const rows = Math.max(lines.length, nl.length, 1);
      const rh = 6 + rows*9;
      y = need(doc,y,rh);
      doc.setFillColor(i%2?247:255,i%2?247:255,i%2?247:255);
      doc.rect(M,y,CW,rh,'F');
      doc.setDrawColor(210); doc.setLineWidth(.4); doc.rect(M,y,CW,rh);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...NAVY);
      doc.text(id, M+5, y+11);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(0,0,0);
      doc.text(lines, M+32, y+11);
      const r = S.ratings[id]||"";
      doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.setTextColor(...(r==="H"?RED:r==="D"?ORANGE:r==="M"?AMBER:r==="S"?[46,125,50]:r==="N"?[127,135,146]:GREY));
      doc.text(r||"-", M+345, y+11);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(60,60,60);
      if(note) doc.text(nl, M+375, y+11);
      y+=rh;
    });
    y+=10;
  });

  // section 5 deficiencies
  const flagged = Object.keys(S.ratings).filter(k=>isOpen(k)).sort((a,b)=>{
    const [al,an]=a.split("."), [bl,bn]=b.split(".");
    return al===bl ? (+an)-(+bn) : al.localeCompare(bl);
  });
  const anyFix = flagged.some(id=>hasFix(id));
  doc.addPage(); y = M+14;
  y = bar(doc,y, anyFix ? '5. Deficiency, correction and recommendation log'
                        : '5. Deficiency and recommendation log');
  if(!flagged.length){
    doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...GREY);
    doc.text('No deficiencies recorded.', M, y); y+=18;
  } else {
    flagged.forEach(id=>{
     defEntries(id).forEach((d,ei)=>{
      const fx = !!d.fixed;
      const foundR = fx ? (d.found||'D') : S.ratings[id];
      const body = fx ? [
        ['Item', entryLabel(id,ei) + '  (found ' + foundR + ', now S)'],
        ['Checklist item', lookupItem(id)],
        ['Location', d.location||''],
        ['Observation', d.observation||''],
        ['Work performed', d.fixWhat||''],
        ['Corrective work by', d.fixBy||''],
        ['Date corrected', d.fixDate?niceDate(d.fixDate):''],
        ['Permit number', d.fixPermit||'Not required']
      ] : [
        ['Item', entryLabel(id,ei) + '  (rated ' + S.ratings[id] + ')'],
        ['Checklist item', lookupItem(id)],
        ['Location', d.location||''],
        ['Observation', d.observation||''],
        ['Priority', d.priority?({'1':'1 - Immediate','2':'2 - Within 30 days','3':'3 - Recommended'})[d.priority]:''],
        ['Recommended action', d.action||'']
      ];
      if(fx){
        const own = d.fixBy===FIXED_BY[0];
        body.push(['Verification', own
          ? 'Corrective work performed by PRO Electrical Services and confirmed complete at the time of this report.'
          : 'Condition confirmed visually as no longer present. This report does not certify the workmanship of the party that performed the corrective work.']);
      }
      let bh = 0;
      const wrapped = body.map(([k,v])=>{
        const ln = doc.splitTextToSize(String(v||'-'), CW-110);
        bh += Math.max(ln.length*10, 12);
        return [k,ln];
      });
      y = need(doc, y, bh+26);
      const rr = fx ? 'FIX' : S.ratings[id];
      doc.setFillColor(...(rr==='FIX'?[244,251,245]:rr==='H'?[255,246,246]:rr==='D'?[255,250,244]:[255,253,245]));
      doc.rect(M,y,CW,bh+16,'F');
      doc.setDrawColor(...(rr==='FIX'?[46,125,50]:rr==='H'?RED:rr==='D'?ORANGE:AMBER)); doc.setLineWidth(2);
      doc.line(M,y,M,y+bh+16);
      doc.setDrawColor(215); doc.setLineWidth(.5); doc.rect(M,y,CW,bh+16);
      let yy = y+13;
      wrapped.forEach(([k,ln])=>{
        doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...NAVY);
        doc.text(k, M+7, yy);
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(0,0,0);
        doc.text(ln, M+100, yy);
        yy += Math.max(ln.length*10, 12);
      });
      y += bh+24;
     });
    });
  }

  // section 6
  y = need(doc,y,90);
  y = bar(doc,y,'6. Overall condition');
  CONDITIONS.forEach((c,i)=>{
    y = need(doc,y,17);
    const on = S.condition===i;
    doc.setDrawColor(120); doc.setLineWidth(.7);
    doc.rect(M+4, y+3, 9, 9);
    if(on){ doc.setFillColor(...NAVY); doc.rect(M+6, y+5, 5, 5, 'F'); }
    doc.setFont('helvetica', on?'bold':'normal'); doc.setFontSize(8.5); doc.setTextColor(0,0,0);
    doc.text(c, M+20, y+11);
    y+=17;
  });
  if(S.cert.comments){
    y+=8; y = need(doc,y,40);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...NAVY);
    doc.text('Additional comments', M, y); y+=11;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(0,0,0);
    const cl = doc.splitTextToSize(S.cert.comments, CW-8);
    doc.text(cl, M, y); y += cl.length*10 + 6;
  }

  // section 7 certification
  doc.addPage(); y = M+14;
  y = bar(doc,y,'7. Inspector certification');
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(0,0,0);
  const att = doc.splitTextToSize('I attest that I personally performed a visual inspection of the electrical installation at the above address on the date shown, and that the observations recorded in this report are accurate to the best of my knowledge, subject to the limitations set out in section 8.', CW);
  doc.text(att, M, y); y += att.length*11 + 8;
  y = kvGrid(doc,y,pair([
    ['Inspector name', S.cert.inspector],
    ['Certificate of Qualification no.', S.cert.coq],
    ['Company', S.cert.company],
    ['Date of inspection', S.info.dateInsp],
    ['Date of report', S.cert.dateReport],
    ['Client name', S.cert.clientName]
  ]));

  y += 6;
  const sigW=210, sigH=62;
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...NAVY);
  doc.text('Inspector signature', M, y);
  doc.text('Client signature', M+270, y);
  y+=5;
  doc.setDrawColor(190); doc.setLineWidth(.6);
  doc.rect(M,y,sigW,sigH); doc.rect(M+270,y,sigW,sigH);
  try{ if(S.sigInsp) doc.addImage(S.sigInsp,'PNG',M+4,y+4,sigW-8,sigH-8); }catch(e){}
  try{ if(S.sigClient) doc.addImage(S.sigClient,'PNG',M+274,y+4,sigW-8,sigH-8); }catch(e){}
  y+=sigH+16;

  // section 8 terms
  doc.addPage(); y = M+14;
  y = bar(doc,y,'8. Scope, limitations and disclaimer');
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...RED);
  doc.text('Read this section carefully. Acceptance of this report constitutes acceptance of the terms below.', M, y);
  y+=14;
  TERMS.forEach((t,i)=>{
    const full = `${i+1}. ${t[0]} ${t[1]}`;
    const ln = doc.splitTextToSize(full, CW-6);
    y = need(doc, y, ln.length*9.6+6);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(20,20,20);
    doc.text(ln, M+4, y);
    y += ln.length*9.6 + 6;
  });

  y = need(doc,y,90); y+=10;
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...NAVY);
  doc.text('Client acknowledgement', M, y); y+=12;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(0,0,0);
  const ack = doc.splitTextToSize('I have received and read this report, including the scope, limitations and disclaimer set out in section 8, and I accept its terms.', CW);
  doc.text(ack, M, y); y += ack.length*11 + 8;
  doc.setDrawColor(190); doc.rect(M,y,sigW,sigH);
  try{ if(S.sigClient) doc.addImage(S.sigClient,'PNG',M+4,y+4,sigW-8,sigH-8); }catch(e){}
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GREY);
  doc.text(`${S.cert.clientName||''}`, M+270, y+20);
  doc.text(`Date: ${S.cert.clientDate||''}`, M+270, y+36);
  y += sigH+20;

  // photo appendix
  const shots = [];
  flagged.forEach(id=>{
    defEntries(id).forEach((d,ei)=>{
      (d.photos||[]).forEach((pObj,i)=>shots.push({id:id, ei:ei, d:d, p:pObj, i:i}));
    });
  });
  if(shots.length){
    doc.addPage(); y = M+14;
    y = bar(doc,y,'9. Photo appendix'); y += 4;
    shots.forEach(sh=>{
      const pObj = sh.p, src = pObj.src||pObj;
      const w = 236;
      const ar = (pObj.w && pObj.h) ? (pObj.h/pObj.w) : 0.75;
      const h = Math.min(Math.round(w*ar), 290);
      /* caption is what was observed at this location, never the checklist wording.
         On a corrected entry the photo is of the completed work, so the correction
         leads and the original finding follows as context. */
      const obs = (sh.d.observation||'').trim() || (sh.d.location||'').trim() || '';
      const work = (sh.d.fixWhat||'').trim();
      const label = `${entryLabel(sh.id,sh.ei)}  photo ${sh.i+1}${sh.d.fixed?'  (after correction)':''}`;
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
      const capX = M + Math.max(96, doc.getTextWidth(label) + 12);
      const capW = CW - (capX - M);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      let capLines = [];
      if(sh.d.fixed){
        if(work) capLines = capLines.concat(doc.splitTextToSize(`Corrected: ${work}`, capW).slice(0,2));
        if(obs)  capLines = capLines.concat(doc.splitTextToSize(`Found: ${obs}`, capW).slice(0,2));
        capLines = capLines.slice(0,3);
      } else {
        capLines = obs ? doc.splitTextToSize(obs, capW).slice(0,2) : [];
      }
      const headH = Math.max(capLines.length*9, 9);
      y = need(doc, y, h+headH+22);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...NAVY);
      doc.text(label, M, y);
      if(capLines.length){
        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...GREY);
        capLines.forEach((ln,k)=>doc.text(ln, capX, y+k*9));
      }
      y += headH+4;
      try{ doc.addImage(src,'JPEG',M,y,w,h); }catch(e){}
      doc.setDrawColor(200); doc.rect(M,y,w,h);
      y += h+14;
    });
  }

  footer(doc);
  return doc;
}

function pair(list){
  const out=[];
  for(let i=0;i<list.length;i+=2) out.push([list[i], list[i+1]]);
  return out;
}

function firstName(){
  const n=(S.info.client||"").trim();
  return n ? n.split(/\s+/)[0] : "";
}

function niceDate(d){
  if(!d) return "";
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
  if(!m) return d;
  const MO=["January","February","March","April","May","June","July",
            "August","September","October","November","December"];
  return `${MO[+m[2]-1]} ${+m[3]}, ${m[1]}`;
}

function fileName(){
  const a=(S.info.address||'inspection').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
  const d=S.info.dateInsp||new Date().toISOString().slice(0,10);
  return `PRO-Inspection-${a}-${d}.pdf`;
}

function ready(){
  if(!window.jspdf){ toast("PDF library not loaded. Connect to the internet once, then reload.",4000); return false; }
  return true;
}

document.getElementById('btnPdf').onclick = ()=>{
  if(!ready()) return;
  preflight("Save PDF", ()=>{
    toast("Building PDF...");
    setTimeout(()=>{
      const doc = buildPDF(), nm = fileName();
      doc.save(nm);
      const ok = archiveCurrent();
      toast(ok ? "PDF saved and added to Reports"
               : "PDF saved. Archive is full, oldest reports were removed.", 3200);
      if(cloudOn()){
        pushCurrent().then(()=>uploadPdf(doc, nm))
          .then(()=>toast("Synced to cloud", 2000))
          .catch(()=>toast("Saved on this device. Cloud sync will retry.", 3200));
      }
    }, 40);
  });
};

async function doSend(){
  toast("Building PDF...");
  await new Promise(r=>setTimeout(r,40));
  const doc = buildPDF();
  const name = fileName();
  const blob = doc.output('blob');
  const to = S.info.email||'';
  const subj = `Electrical Inspection Report  |  ${[S.info.address,S.info.city].filter(Boolean).join(', ')}`;
  const loc = [S.info.address, S.info.city].filter(Boolean).join(", ");
  const who = S.info.insurer || "the insurer";
  const salutation = S.info.client ? `Dear ${S.info.client},` : "Dear Sir or Madam,";

  const hazards = Object.keys(S.ratings).filter(k=>S.ratings[k]==="H");
  const hazLine = hazards.length
    ? `\nThe inspection identified ${hazards.length===1?"one condition":hazards.length+" conditions"} requiring immediate attention. ${hazards.length===1?"It is":"They are"} recorded in section 5 of the report together with the recommended corrective action, and should be addressed without delay.\n`
    : "";

  /* corrected items: the owner needs to know this is the one to forward */
  const fixedCount = Object.keys(S.ratings).reduce((n,id)=>
    n + (S.defects[id]||[]).filter(d=>d&&d.fixed).length, 0);
  const fixLine = fixedCount
    ? `\n${fixedCount===1?"One item was":fixedCount+" items were"} found deficient during the inspection and ${fixedCount===1?"has":"have"} since been corrected. ${fixedCount===1?"It is":"They are"} shown in section 5 with the work performed, who performed it, and the date, so the history is visible in a single document.\n`
    : "";

  const supLine = !isInitial()
    ? `\nThis report replaces${S.info.prevReportNo?" report "+S.info.prevReportNo:" the earlier report"}${S.info.prevDate?" dated "+niceDate(S.info.prevDate):""} and is the current version. Please forward this version rather than the earlier one.\n`
    : "";

  const details = [
    ["Property", loc],
    ["Report type", isInitial()?"":S.info.reportType],
    ["Date of inspection", niceDate(S.info.dateInsp)],
    ["Report number", S.info.reportNo],
    ["Policy or quote number", S.info.policy],
    ["Prepared for", S.info.insurer]
  ].filter(r=>r[1]).map(r=>`${r[0]}: ${r[1]}`).join("\n");

  const body =
`${salutation}

Attached is the electrical inspection report prepared by PRO Electrical Services for the property noted below.

${details}
${hazLine}
This report may be forwarded to ${who} without alteration. The attached PDF is the complete record and includes the inspection checklist, any deficiencies identified, supporting photographs where applicable, and the signed certification.

The inspection was visual and non-invasive, and covers the components that were accessible and visible on the date of inspection. The full scope, limitations and disclaimer are set out in section 8 of the report.

Should the property owner or the insurer require clarification of any finding, please contact our office and we will be glad to assist.

Regards,

PRO Electrical Services
Box 495, Nampa, AB T0H 2R0
780-625-5880  |  admin@proes.ca  |  www.proes.ca`;

  const file = new File([blob], name, {type:'application/pdf'});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:subj, text:body});
      archiveCurrent();
      if(cloudOn()){ try{ await pushCurrent(); await uploadPdf(doc, name); }catch(e){} }
      toast("Shared and added to Reports");
      return;
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  archiveCurrent();
  if(cloudOn()){ try{ await pushCurrent(); await uploadPdf(doc, name); }catch(e){} }
  doc.save(name);
  window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  toast("PDF saved. Attach it to the draft.",4200);
}

document.getElementById('btnSend').onclick = ()=>{
  if(!ready()) return;
  preflight("Finish & Email", doSend);
};

document.getElementById('btnClear').onclick = ()=>{
  if(!confirm("Start a new inspection? This clears the current one.")) return;
  try{ localStorage.removeItem(KEY); localStorage.removeItem(BKEY); }catch(e){}
  location.reload();
};

/* ---------------- init ---------------- */
/* hosted copy: register the offline worker. A local file skips this. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
load();
if(!S.id) S.id = newId();
if(!S.cert.company) S.cert.company = "PRO Electrical Services";
render();
window.addEventListener('resize', ()=>{ initSig("sigInsp","sigInsp"); initSig("sigClient","sigClient"); });
</script>
</body>
